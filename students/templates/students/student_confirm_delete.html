{% extends 'students/base.html' %}

{% block content %}

<div class="form-container">

    <h1>Delete Student</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong>?
    </p>


    <form method="POST">

        {% csrf_token %}

        <button type="submit"
                class="delete-btn">

            Yes, Delete

        </button>


        <a href="{% url 'student_list' %}"
           class="cancel-btn">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
